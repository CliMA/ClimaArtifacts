name: Check artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
     - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # The repository is not a package, so run the test script directly instead of Pkg.test
      - name: Run tests
        run: julia --color=yes --project=test test/runtests.jl
